name: Verificación
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pytest backend/tests
      - run: .venv/bin/ruff check backend
      - run: .venv/bin/ruff format --check backend
      - run: npm ci
        working-directory: frontend
      - run: ../.venv/bin/python -m scripts.export_openapi
        working-directory: backend
      - run: npm run api:types && git diff --exit-code -- src/shared/api-schema.ts
        working-directory: frontend
      - run: npm test && npm run lint && npm run format:check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruebas-navegador
          path: frontend/test-results/
